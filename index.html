<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="R GAMES STUDIO is a dark-mode HTML5 gaming destination. Play verified browser games instantly.">
    <meta property="og:title" content="R GAMES STUDIO — Play Beyond Limits">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#09090D">
    <title>R GAMES STUDIO — Play Beyond Limits</title>
    <!-- Google Fonts: Plus Jakarta Sans, Space Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
    <!-- JSZip for Real Client-Side ZIP Inspection, Validation & Multi-File Project Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* ==========================================================================
           1. BESPOKE AAA STOREFRONT DESIGN SYSTEM (NON-GENERIC, HANDCRAFTED FEEL)
           Inspired by Riot Client, CrazyGames & Epic Store.
           Exact Brand Palette: #09090D, #111118, #171720, #F04468, #FF607F
           ========================================================================== */
        :root {
            --bg-main: #09090D;
            --bg-secondary: #111118;
            --bg-card: #171720;
            --bg-card-hover: #1E1E2A;
            --bg-elevated: #222230;
            --fire-primary: #F04468;
            --fire-orange: #FF607F;
            --electric-blue: #00E5FF;
            --accent-secondary: #FF607F;
            --text-primary: #FFFFFF;
            --text-secondary: #92929F;
            --text-muted: #5C5C6B;
            --border-color: #292934;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-hover: #3A3A4A;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle Ambient Canvas (kept ultra-minimal & atmospheric) */
        #energyFxCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.45;
        }

        #publicAppRoot, #adminAppRoot {
            position: relative;
            z-index: 2;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb {
            background: #292934;
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--fire-primary); }

        a { color: inherit; text-decoration: none; }
        button, input, select, textarea {
            font-family: inherit;
            color: inherit;
            background: none;
            border: none;
            outline: none;
        }
        button { cursor: pointer; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }

        /* ==========================================================================
           2. AUTHENTIC GAMING PORTAL SHELL (TOPBAR + SIDE RAIL + STAGE)
           ========================================================================== */
        .pub-header {
            height: 68px;
            background: rgba(9, 9, 13, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .pub-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.3px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .brand-emblem {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--fire-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(240, 68, 104, 0.35);
            position: relative;
        }

        .brand-emblem::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            pointer-events: none;
        }

        .brand-emblem svg {
            width: 20px;
            height: 20px;
            fill: #FFFFFF;
        }

        .brand-text {
            color: #FFFFFF;
            letter-spacing: -0.4px;
        }

        .brand-text span {
            color: var(--fire-primary);
            font-weight: 700;
        }

        .pub-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pub-nav-link {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            transition: color 0.16s ease, background 0.16s ease;
        }

        .pub-nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .pub-nav-link.active {
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .pub-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-trigger-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 14px;
            width: clamp(200px, 26vw, 360px);
            transition: border-color 0.18s ease, background 0.18s ease;
        }

        .search-trigger-bar:focus-within {
            border-color: var(--fire-primary);
            background: var(--bg-card);
        }

        .search-trigger-bar svg {
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .search-trigger-bar:focus-within svg {
            color: var(--fire-primary);
        }

        .search-trigger-bar input {
            width: 100%;
            font-size: 13.5px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .search-trigger-bar input::placeholder { color: var(--text-muted); }

        .mobile-menu-btn {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        /* Portal Body Layout: Left Sidebar Dock + Main Stage */
        .portal-layout {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 68px);
        }

        .portal-rail {
            width: 228px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
            position: sticky;
            top: 68px;
            height: calc(100vh - 68px);
            overflow-y: auto;
        }

        .rail-group-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 6px;
        }

        .rail-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .rail-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 9px;
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .rail-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .rail-item svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            opacity: 0.78;
        }

        .rail-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        .rail-item.active {
            background: rgba(240, 68, 104, 0.13);
            color: #FFFFFF;
        }

        .rail-item.active svg {
            color: var(--fire-primary);
            opacity: 1;
        }

        .rail-count {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 7px;
            border-radius: 6px;
        }

        .rail-item.active .rail-count {
            background: var(--fire-primary);
            color: #FFFFFF;
        }

        .portal-stage {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1380px;
            margin: 0 auto;
            padding: 0 clamp(16px, 3vw, 36px);
        }

        /* ==========================================================================
           3. EDITORIAL WIDESCREEN SPOTLIGHT BANNER (NO AI CLICHES)
           ========================================================================== */
        .spotlight-wrapper {
            padding: 28px 0 12px;
        }

        .spotlight-banner {
            position: relative;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: clamp(28px, 4.5vw, 52px);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 32px;
            align-items: center;
        }

        .spotlight-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 82% 28%, rgba(240, 68, 104, 0.16) 0%, transparent 52%),
                radial-gradient(circle at 92% 85%, rgba(0, 229, 255, 0.09) 0%, transparent 45%),
                linear-gradient(120deg, rgba(17, 17, 24, 0.98) 35%, rgba(23, 23, 32, 0.75) 100%);
            pointer-events: none;
        }

        /* Subtle architectural grid lines on right side of banner */
        .spotlight-mesh {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 55%;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to left, rgba(0,0,0,1), transparent);
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1), transparent);
            pointer-events: none;
        }

        .spotlight-content {
            position: relative;
            z-index: 2;
            max-width: 620px;
        }

        .studio-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--fire-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            background: rgba(240, 68, 104, 0.1);
            border: 1px solid rgba(240, 68, 104, 0.25);
            padding: 5px 11px;
            border-radius: 6px;
        }

        .studio-kicker-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--fire-primary);
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(32px, 4.6vw, 56px);
            font-weight: 800;
            line-height: 1.04;
            letter-spacing: -1.4px;
            margin-bottom: 16px;
            color: #FFFFFF;
        }

        .hero-title .text-crimson {
            color: var(--fire-primary);
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: clamp(14.5px, 1.5vw, 16.5px);
            line-height: 1.6;
            margin-bottom: 26px;
            max-width: 520px;
        }

        .hero-cta-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Featured Card / Live Status Card on Right of Banner */
        .spotlight-feature-card {
            position: relative;
            z-index: 2;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        }

        .spotlight-preview-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spotlight-preview-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spotlight-standby-graphic {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        .spotlight-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        /* ==========================================================================
           4. STOREFRONT BUTTONS & FILTER BAR
           ========================================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13.5px;
            transition: transform 0.16s var(--ease-out), background 0.16s ease, border-color 0.16s ease;
            user-select: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--fire-primary);
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(240, 68, 104, 0.3);
        }

        .btn-primary:hover {
            background: var(--fire-orange);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.14);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #FFFFFF;
        }

        .btn-sm {
            padding: 7px 13px;
            font-size: 12.5px;
            border-radius: 8px;
        }

        /* Section Layout */
        .section-block {
            padding: 24px 0 48px;
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 18px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .section-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .section-count-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
        }

        /* Segmented Tab Bar */
        .segmented-tabs {
            display: inline-flex;
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            gap: 2px;
            overflow-x: auto;
        }

        .filter-pill {
            padding: 7px 14px;
            border-radius: 7px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .filter-pill:hover {
            color: var(--text-primary);
        }

        .filter-pill.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        /* Horizontal Category Chips (When categories exist) */
        .category-chips-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 18px;
        }

        .cat-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 99px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }

        .cat-chip:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .cat-chip.active {
            background: var(--fire-primary);
            border-color: var(--fire-primary);
            color: #FFFFFF;
        }

        /* ==========================================================================
           5. STOREFRONT GAME CARDS & CLEAN EMPTY STATE
           ========================================================================== */
        .empty-arena-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: clamp(44px, 7vw, 76px) 24px;
            text-align: center;
            max-width: 680px;
            margin: 12px auto;
        }

        .empty-arena-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: var(--fire-primary);
        }

        .empty-arena-title {
            font-family: var(--font-display);
            font-size: clamp(22px, 3vw, 28px);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-arena-desc {
            color: var(--text-secondary);
            font-size: 15px;
            max-width: 440px;
            margin: 0 auto;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s var(--ease-out), border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
        }

        .game-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--bg-main);
            overflow: hidden;
        }

        .game-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s var(--ease-out);
        }

        .game-card:hover .game-thumb {
            transform: scale(1.04);
        }

        .game-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 35%, rgba(9, 9, 13, 0.9) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .game-card:hover .game-card-overlay {
            opacity: 1;
        }

        .play-badge-floating {
            background: var(--fire-primary);
            color: #FFFFFF;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .game-cat-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(9, 9, 13, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .game-card-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-card-title {
            font-family: var(--font-display);
            font-size: 16.5px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-card-desc {
            color: var(--text-secondary);
            font-size: 13px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
            flex: 1;
        }

        .game-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* ==========================================================================
           4. FUTURISTIC GAME PLAYER HUD STYLES (css/player.css)
           ========================================================================== */
        .player-stage-wrap {
            background: #0C0F1D;
            border: 1px solid var(--border-electric);
            border-radius: var(--radius-lg);
            overflow: hidden;

        .pub-header { padding-top: env(safe-area-inset-top, 0px); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

        /* ==========================================================================
           HOME PAGE: ANIMATION + RESPONSIVE LAYER

        html, body { max-width: 100%; overflow-x: hidden; }

        /* Hero: moving aurora, drifting grid, glowing frame */
        .spotlight-banner { isolation: isolate; border-color: rgba(240, 68, 104, 0.35); animation: rgBannerIn .9s var(--ease-out) both; }
        .spotlight-banner::after {

            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }

        .games-grid .game-card:nth-child(1){animation-delay:.05s}.games-grid .game-card:nth-child(2){animation-delay:.1s}.games-grid .game-card:nth-child(3){animation-delay:.15s}

        @keyframes rgBorderZap { 0%, 100% { box-shadow: 0 0 0 rgba(0,229,255,0); } 2%, 5% { box-shadow: 0 0 40px rgba(0,229,255,.45), inset 0 0 40px rgba(0,229,255,.12); } 3%, 8% { box-shadow: 0 0 0 rgba(0,229,255,0); } }

<body>

    <!-- ==========================================================================
         FUTURISTIC FIRE & ELECTRIC-BLUE ENERGY PARTICLE CANVAS
         ========================================================================== -->
    <canvas id="energyFxCanvas"></canvas>

    <!-- ==========================================================================
         ROOT MOUNT CONTAINERS
         1. #publicAppRoot -> Public Gaming Portal (Never shows Admin links/buttons or URLs)
         2. #adminAppRoot  -> Private Admin Portal (Reachable via direct route or Ctrl+Shift+A)
         ========================================================================== -->
    <div id="publicAppRoot" style="display: none; flex: 1; flex-direction: column;"></div>
    <div id="adminAppRoot" style="display: none; flex: 1; flex-direction: column;"></div>

    <!-- Modal & Toast Containers -->
    <div id="modalBackdrop" class="modal-backdrop">
        <div id="modalContent" class="modal-box"></div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <!-- ==========================================================================
         MODULAR VANILLA JAVASCRIPT ARCHITECTURE (ES6+)
         Includes Real Firebase Firestore Auth & Persistence + External Supabase/Firebase
         Connector + Client-side ZIP Extraction Engine + Multi-File ZIP Exporter
         ========================================================================== -->
    <script type="module">

        /* --------------------------------------------------------------------------
           MODULE 1: UTILITIES & SANITIZATION (js/app.js)
           -------------------------------------------------------------------------- */
        const ALLOWED_CATEGORIES = [
            "Action", "Adventure", "Arcade", "Racing", "Sports",
            "Puzzle", "Strategy", "Shooting", "Simulation", "Casual",
            "Multiplayer", "Other"
        ];

        function escapeHTML(str = "") {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function slugify(text = "") {
            return String(text).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        }

        function formatDate(timestamp) {
            if (!timestamp) return "Just now";
            const d = new Date(timestamp);
            return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
        }

        async function sha256Hash(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        function showToast(message, type = "info") {
            const container = document.getElementById("toastContainer");
            const el = document.createElement("div");
            el.className = "toast-item";
            if (type === "success") el.style.borderLeftColor = "var(--success)";
            if (type === "error") el.style.borderLeftColor = "var(--danger)";
            el.innerHTML = `
                <span>${escapeHTML(message)}</span>
                <button type="button" style="color:var(--text-secondary);font-weight:700;display:inline-flex;align-items:center;" aria-label="Close notification">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            `;
            el.querySelector("button").onclick = () => el.remove();
            container.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, 4200);
        }

        function openModal(htmlContent) {
            const backdrop = document.getElementById("modalBackdrop");
            const box = document.getElementById("modalContent");
            box.innerHTML = htmlContent;
            backdrop.classList.add("open");
        }

        function closeModal() {
            const backdrop = document.getElementById("modalBackdrop");
            backdrop.classList.remove("open");
            document.getElementById("modalContent").innerHTML = "";
        }

        document.getElementById("modalBackdrop").addEventListener("click", (e) => {
            if (e.target.id === "modalBackdrop") closeModal();
        });

        /* --------------------------------------------------------------------------
           MODULE 2: DATABASE & CLOUD PERSISTENCE ENGINE (js/database.js)
           Zero Dummy Games on Launch. Uses real Firestore collections.
           -------------------------------------------------------------------------- */
        const appState = {
            currentPath: "/index.html",
            queryParams: new URLSearchParams(),
            games: [],          // Strictly empty at initial installation
            categories: [],     // Populated dynamically from real DB / published games
            user: null,         // Signed-in account from the Neon API (null = signed out)
            hasOwner: null,     // null = unknown yet, true/false once /api/status answered
            adminSession: null, // Active authenticated owner session
            searchQuery: "",
            selectedCategory: "All",
            publicTab: "all",   // all | trending | new | popular
            adminSubView: "dashboard", // dashboard | upload | all-games | published | drafts | categories | settings
            editingGameId: null,
            activeRuntimeUrls: new Map(), // Runtime Blob URLs for extracted HTML5 ZIP packages
            dbReady: false,
            adminsLoaded: false,        // true once the owner-account listener has delivered (prevents setup race)
            gamesSig: "",
            localPackages: new Map(),   // in-memory game packages when no database is configured
            compiledCache: new Map(),   // compiled srcdoc per game package
            playedThisSession: new Set(),
            playingGameId: null,
            playToken: 0
        };

        const CHUNK_BYTES = 700 * 1024;          // each chunk is sent as base64 (~930 KB) to stay well under Vercel's 4.5 MB request limit
        const MAX_PACKAGE_MB = 20;               // Max stored size of one game package
        const MAX_EXPANDED_MB = 150;             // Zip-bomb guard: max total size after extraction

        // Games and game files are stored in Turso through /api/games and /api/chunks.
        async function fetchGames() {
            const d = await apiCall("/api/games", "GET", undefined, 20000);
            const loadedGames = (d.games || []).slice().sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
            // Play-counter increments alone should not repaint the whole page for everyone.
            const sig = loadedGames.map(g => `${g.id}:${g.updated_at || 0}:${g.status}`).join("|");
            const unchanged = appState.dbReady && sig === appState.gamesSig;
            appState.gamesSig = sig;
            appState.games = loadedGames;
            appState.dbReady = true;
            if (!unchanged && !shouldDeferRender()) renderCurrentRoute();
        }

        async function initCloudDatabase() {
            // Safety net: never leave the visitor on a blank page if the database is unreachable.
            setTimeout(() => {
                if (!appState.dbReady) {
                    appState.dbReady = true;
                    renderCurrentRoute();
                }
            }, 8000);

            try {
                await fetchGames();
            } catch (err) {
                console.error("Games could not be loaded:", err);
                showToast(err.message || "Could not load games.", "error");
                appState.dbReady = true;
                appState.adminsLoaded = true;
                renderCurrentRoute();
            }
            appState.adminsLoaded = true;
            setInterval(() => { fetchGames().catch(() => {}); }, 60000);
        }

        // Re-rendering replaces the whole DOM. Skip it when that would interrupt the user
        // (a running game, a half-filled upload form, or typing in the search box).
        function shouldDeferRender() {
            if (appState.currentPath === "/game.html" && document.getElementById("activeGameIframe")) return true;
            if (appState.currentPath.startsWith("/admin/") && document.getElementById("gameUploadForm")) return true;
            if (document.getElementById("adminAuthForm") || document.getElementById("publicAuthForm")) return true;
            const active = document.activeElement;
            if (active && active.id === "publicSearchInput") return true;
            return false;
        }

        async function saveGameToDatabase(gameRecord) {
            await apiCall("/api/games", "POST", { action: "save", game: gameRecord }, 30000);
            const idx = appState.games.findIndex(g => g.id === gameRecord.id);
            if (idx >= 0) appState.games[idx] = { ...appState.games[idx], ...gameRecord };
            else appState.games.unshift({ plays: 0, ...gameRecord });
            appState.gamesSig = "";
            renderCurrentRoute();
        }

        async function deleteGameFromDatabase(gameId) {
            if (appState.activeRuntimeUrls.has(gameId)) {
                URL.revokeObjectURL(appState.activeRuntimeUrls.get(gameId));
                appState.activeRuntimeUrls.delete(gameId);
            }
            await apiCall("/api/games", "POST", { action: "delete", id: gameId }, 30000);
            appState.games = appState.games.filter(g => g.id !== gameId);
            appState.gamesSig = "";
            renderCurrentRoute();
        }

        /* --------------------------------------------------------------------------
           NEON AUTH CLIENT: talks to the serverless API in /api (register, login, me, logout)
           -------------------------------------------------------------------------- */
        async function apiCall(path, method = "GET", body, timeoutMs = 15000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            let r;
            try {
                r = await fetch(path, {
                    method,
                    credentials: "same-origin",
                    headers: body ? { "Content-Type": "application/json" } : undefined,
                    body: body ? JSON.stringify(body) : undefined,
                    signal: ctrl.signal
                });
            } catch (err) {
                throw new Error("Cannot reach the server. Deploy the site on Vercel (or run `vercel dev`) so /api works.");
            } finally {
                clearTimeout(timer);
            }
            let data = {};
            try { data = await r.json(); } catch (err) { /* not JSON */ }
            if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
            return data;
        }

        function applySignedInUser(user) {
            appState.user = user || null;
            if (user && user.role === "owner") startAdminSession(user.email);
            else appState.adminSession = null;
            if (appState.dbReady) fetchGames().catch(() => {});
        }

        async function restoreSession() {
            try {
                const { user } = await apiCall("/api/me", "GET", undefined, 5000);
                applySignedInUser(user);
            } catch (err) {
                console.warn("Session check skipped:", err.message);
            }
        }

        async function refreshOwnerStatus() {
            try {
                const d = await apiCall("/api/status", "GET", undefined, 8000);
                appState.hasOwner = !!d.hasOwner;
            } catch (err) {
                appState.hasOwner = true; // fall back to the normal login form
                showToast(err.message, "error");
            }
        }

        async function signOutEverywhere() {
            try { await apiCall("/api/logout", "POST"); } catch (err) { /* cookie may already be gone */ }
            appState.user = null;
            appState.adminSession = null;
            if (appState.dbReady) fetchGames().catch(() => {});
        }

        /* --- Game package storage: the original ZIP is split into chunks stored in Turso (table game_chunks) --- */
        function bytesToBase64(bytes) {
            let bin = "";
            for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(bin);
        }
        function base64ToBytes(b64) {
            const bin = atob(b64);
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        async function savePackageChunks(gameId, pkgId, bytes, onProgress) {
            const total = Math.max(1, Math.ceil(bytes.length / CHUNK_BYTES));
            for (let i = 0; i < total; i++) {
                const part = bytes.slice(i * CHUNK_BYTES, (i + 1) * CHUNK_BYTES);
                await apiCall("/api/chunks", "POST", { game: gameId, pkg: pkgId, i, data: bytesToBase64(part) }, 60000);
                if (onProgress) onProgress(i + 1, total);
            }
            return total;
        }

        async function loadPackageBytes(game) {
            const count = game.chunk_count || 0;
            if (!game.package_id || count < 1) throw new Error("This game has no stored files.");
            const parts = await Promise.all(Array.from({ length: count }, async (_, i) => {
                const d = await apiCall(`/api/chunks?game=${encodeURIComponent(game.id)}&pkg=${encodeURIComponent(game.package_id)}&i=${i}`, "GET", undefined, 60000);
                return base64ToBytes(d.data);
            }));
            const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
            let offset = 0;
            parts.forEach(p => { out.set(p, offset); offset += p.length; });
            return out;
        }

        // keepPkgId: chunks of this package are kept; everything else is removed. null removes all chunks.
        async function deletePackageChunks(gameId, keepPkgId) {
            await apiCall("/api/chunks", "POST", { action: "prune", game: gameId, keep: keepPkgId || "" }, 30000);
        }

        /* --- Play counter (once per browser session per game) --- */
        function recordPlay(game) {
            if (appState.playedThisSession.has(game.id)) return;
            appState.playedThisSession.add(game.id);
            try {
                const seen = JSON.parse(sessionStorage.getItem("rg_played") || "[]");
                if (seen.includes(game.id)) return;
                seen.push(game.id);
                sessionStorage.setItem("rg_played", JSON.stringify(seen));
            } catch (err) { /* storage may be unavailable; fall through */ }

            apiCall("/api/games", "POST", { action: "play", id: game.id }, 8000).catch(err => console.warn("Play count skipped:", err));
            const g = appState.games.find(x => x.id === game.id);
            if (g) g.plays = (g.plays || 0) + 1;
        }

        function loadSavedFor(gameId) {
            try { return JSON.parse(localStorage.getItem("rg_save_" + gameId) || "{}") || {}; }
            catch (err) { return {}; }
        }

        /* --------------------------------------------------------------------------
           MODULE 3: SAFE HTML5 ZIP VALIDATION, CHUNKED STORAGE & ASSET COMPILER (js/storage.js)
           -------------------------------------------------------------------------- */
        const MIME_BY_EXT = {
            html: "text/html", htm: "text/html", css: "text/css", js: "text/javascript", mjs: "text/javascript",
            json: "application/json", txt: "text/plain", xml: "application/xml", svg: "image/svg+xml",
            png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp",
            avif: "image/avif", ico: "image/x-icon", mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg",
            m4a: "audio/mp4", aac: "audio/aac", flac: "audio/flac", mp4: "video/mp4", webm: "video/webm",
            woff: "font/woff", woff2: "font/woff2", ttf: "font/ttf", otf: "font/otf", wasm: "application/wasm",
            glb: "model/gltf-binary", gltf: "model/gltf+json", bin: "application/octet-stream"
        };

        function mimeFor(path) {
            const ext = (path.split(".").pop() || "").toLowerCase();
            return MIME_BY_EXT[ext] || "application/octet-stream";
        }

        function listZipFiles(zip) {
            return Object.keys(zip.files).filter(n =>
                !zip.files[n].dir &&
                !n.startsWith("__MACOSX/") &&
                !/(^|\/)\.DS_Store$/.test(n)
            );
        }

        function pickEntryFile(names) {
            const depth = (p) => p.split("/").length;
            const htmls = names.filter(n => /\.html?$/i.test(n));
            const indexes = htmls.filter(n => /(^|\/)index\.html?$/i.test(n)).sort((a, b) => depth(a) - depth(b));
            if (indexes.length) return indexes[0];
            return htmls.sort((a, b) => depth(a) - depth(b))[0] || null;
        }

        // Validates a ZIP (already read into memory) and returns the loaded JSZip object.
        async function loadAndValidateZip(bytes) {
            if (!bytes || !bytes.length) throw new Error("The uploaded file is empty.");
            if (bytes.length > MAX_PACKAGE_MB * 1024 * 1024) {
                throw new Error(`Archive exceeds the ${MAX_PACKAGE_MB}MB limit.`);
            }

            let zip;
            try {
                zip = await window.JSZip.loadAsync(bytes);
            } catch (err) {
                throw new Error("Invalid archive. The file is not a readable ZIP.");
            }

            const names = listZipFiles(zip);
            if (names.length === 0) throw new Error("The uploaded ZIP archive is empty.");
            if (names.length > 2500) throw new Error("Archive contains too many files (limit 2500).");

            let declaredTotal = 0;
            for (const raw of names) {
                const normalized = raw.replace(/\\/g, "/");
                const segments = normalized.split("/");
                if (normalized.startsWith("/") || /^[a-zA-Z]:/.test(normalized) || segments.includes("..")) {
                    throw new Error(`Security Violation: unsafe path detected in archive entry "${raw}".`);
                }
                const size = zip.files[raw] && zip.files[raw]._data && zip.files[raw]._data.uncompressedSize;
                if (typeof size === "number") declaredTotal += size;
            }
            if (declaredTotal > MAX_EXPANDED_MB * 1024 * 1024) {
                throw new Error(`Security Violation: archive expands to more than ${MAX_EXPANDED_MB}MB.`);
            }

            if (!pickEntryFile(names)) {
                throw new Error("Validation Failed: No index.html or HTML entry file found inside the ZIP archive.");
            }
            return { zip, count: names.length };
        }

        async function buildZipFromHtml(htmlText) {
            const z = new window.JSZip();
            z.file("index.html", htmlText);
            const bytes = await z.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
            if (bytes.length > MAX_PACKAGE_MB * 1024 * 1024) throw new Error(`HTML file exceeds the ${MAX_PACKAGE_MB}MB limit.`);
            return bytes;
        }

        async function asyncReplace(str, regex, fn) {
            const out = [];
            let last = 0;
            let m;
            regex.lastIndex = 0;
            while ((m = regex.exec(str)) !== null) {
                out.push(str.slice(last, m.index));
                out.push(await fn(m));
                last = m.index + m[0].length;
                if (m[0].length === 0) regex.lastIndex++;
            }
            out.push(str.slice(last));
            return out.join("");
        }

        /* ------------------------------------------------------------------
           Runtime shim injected into every game page.
           It runs inside the sandboxed iframe (opaque origin) and:
             1. maps relative asset paths (fetch / XHR / <img> / <audio> / dynamic <script> ...) to
                blob URLs created from the bundled files, and
             2. replaces localStorage/sessionStorage (blocked in a sandbox without allow-same-origin)
                with an in-memory store; localStorage changes are posted to the player so saves persist.
           This function is serialised with toString(), so it must not reference outer variables.
           ------------------------------------------------------------------ */
        function rgShimMain(FILES, SAVED) {
            "use strict";
            var blobCache = {};

            function norm(p) {
                if (typeof p !== "string") return null;
                if (/^(?:[a-z][a-z0-9+.\-]*:|\/\/|#)/i.test(p)) return null;
                p = p.split("#")[0].split("?")[0];
                try { p = decodeURI(p); } catch (e) { /* keep raw */ }
                var out = [];
                p.split("/").forEach(function (s) {
                    if (s === "..") out.pop();
                    else if (s && s !== ".") out.push(s);
                });
                return out.join("/");
            }

            function toUrl(p) {
                var k = norm(p);
                if (k === null || !Object.prototype.hasOwnProperty.call(FILES, k)) return null;
                if (!blobCache[k]) {
                    var bin = atob(FILES[k][1]);
                    var u8 = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                    blobCache[k] = URL.createObjectURL(new Blob([u8], { type: FILES[k][0] }));
                }
                return blobCache[k];
            }

            function installStorage(name) {
                try { window[name].getItem("__rg_probe"); return; } catch (e) { /* blocked: install fallback */ }
                var data = {};
                if (name === "localStorage" && SAVED) {
                    Object.keys(SAVED).forEach(function (k) { data[k] = String(SAVED[k]); });
                }
                var timer = null;
                function persist() {
                    if (name !== "localStorage") return;
                    clearTimeout(timer);

        /* ------------------------------------------------------------------
           Compiles a loaded ZIP into one self-contained srcdoc string:
             - <script src> and <link rel=stylesheet> are inlined (deferred / module scripts move to the end of <body>)
             - CSS url(...) and @import are resolved
             - small assets referenced from the markup become data URIs
             - every remaining file is bundled for the runtime shim (fetch/XHR/Audio/Image/dynamic scripts)
           Limitation: ES modules that import other relative modules need to be bundled (e.g. Vite build) first.
           ------------------------------------------------------------------ */
        async function compileZipToSrcdoc(zip) {
            const names = listZipFiles(zip);
            const entryRaw = pickEntryFile(names);
            if (!entryRaw) throw new Error("Validation Failed: No index.html or HTML entry file found inside the ZIP archive.");

            const entryKey = entryRaw.replace(/\\/g, "/");
            const baseDir = entryKey.includes("/") ? entryKey.slice(0, entryKey.lastIndexOf("/") + 1) : "";

            const fileMap = new Map(); // path relative to the entry folder -> JSZip object
            names.forEach(n => {
                const key = n.replace(/\\/g, "/");
                if (key.startsWith(baseDir) && n !== entryRaw) fileMap.set(key.slice(baseDir.length), zip.files[n]);
            });

            let budget = MAX_EXPANDED_MB * 1024 * 1024;
            const spend = (n) => {
                budget -= n;
                if (budget < 0) throw new Error(`Security Violation: archive expands to more than ${MAX_EXPANDED_MB}MB.`);
            };
            const sizeOf = (obj) => (obj && obj._data && typeof obj._data.uncompressedSize === "number") ? obj._data.uncompressedSize : 0;

            const isExternal = (r) => /^(?:[a-z][a-z0-9+.\-]*:|\/\/|#)/i.test(r);
            function resolveRef(fromDir, ref) {
                if (!ref || isExternal(ref)) return null;
                let p = ref.split("#")[0].split("?")[0];
                try { p = decodeURI(p); } catch (e) { /* keep raw */ }
                const segs = (p.startsWith("/") ? p : fromDir + p).split("/");
                const out = [];
                for (const s of segs) {
                    if (s === "..") out.pop();
                    else if (s && s !== ".") out.push(s);
                }
                const key = out.join("/");
                return fileMap.has(key) ? key : null;
            }

            const b64Cache = new Map();
            const base64Of = (k) => {
                if (!b64Cache.has(k)) {
                    b64Cache.set(k, (async () => {
                        const b = await fileMap.get(k).async("base64");
                        spend(Math.ceil(b.length * 0.75));
                        return b;
                    })());
                }
                return b64Cache.get(k);
            };
            const dataUri = async (k) => `data:${mimeFor(k)};base64,${await base64Of(k)}`;
            const readText = async (k) => {
                const t = await fileMap.get(k).async("string");
                spend(t.length);
                return t;
            };

            const cssCache = new Map();
            const inlined = new Set();
            async function processCss(key, depth = 0) {
                if (cssCache.has(key)) return cssCache.get(key);
                let css = await readText(key);
                const dir = key.includes("/") ? key.slice(0, key.lastIndexOf("/") + 1) : "";

                if (depth < 4) {
                    css = await asyncReplace(css, /@import\s+(?:url\(\s*)?["']?([^"')\s;]+)["']?\s*\)?\s*;/gi, async (m) => {
                        const k = resolveRef(dir, m[1]);
                        if (!k || !/\.css$/i.test(k)) return m[0];
                        inlined.add(k);
                        return await processCss(k, depth + 1);
                    });
                }

                css = await asyncReplace(css, /url\(\s*(["']?)([^"')]+?)\1\s*\)/gi, async (m) => {
                    const k = resolveRef(dir, m[2].trim());
                    if (!k || /\.css$/i.test(k)) return m[0];
                    return `url("${await dataUri(k)}")`;

                cssCache.set(key, css);

            html = await asyncReplace(html, /<link\b[^>]*>/gi, async (m) => {

            });

            // 3) scripts
            const deferred = [];
            html = await asyncReplace(html, /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, async (m) => {
                const attrs = m[1];
                const sm = attrs.match(/(?:^|\s)src\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
                if (!sm) return m[0];
                const k = resolveRef("", (sm[1] ?? sm[2] ?? sm[3] ?? "").trim());
                if (!k) return m[0];

                const code = (await readText(k)).replace(/<\/script/gi, "<\\/script");
                inlined.add(k);
                const isDeferred = /(?:^|\s)defer(?:\s|=|$)/i.test(attrs) || /type\s*=\s*["']?module/i.test(attrs);

                    .replace(sm[0], "")

                html = /<\/body\s*>/i.test(html)
                    ? html.replace(/<\/body\s*>/i, (m) => block + m)

            const files = {};
            for (const [k] of fileMap) {
                if (inlined.has(k)) continue;
                files[k] = [mimeFor(k), await base64Of(k)];
            }

            return { html: wrapWithShim(html, files), assetCount: fileMap.size + 1 };
        }

        // Resolves what the player should load for a stored game.
        async function getFrameSource(game) {
            if (game.source_type === "url" && game.game_url) return { kind: "url", url: game.game_url };

            if (game.package_id) {
                const key = `${game.id}:${game.package_id}`;
                let html = appState.compiledCache.get(key);
                if (!html) {
                    const bytes = await loadPackageBytes(game);
                    const { zip } = await loadAndValidateZip(bytes);
                    html = (await compileZipToSrcdoc(zip)).html;
                    if (appState.compiledCache.size >= 3) {
                        appState.compiledCache.delete(appState.compiledCache.keys().next().value);
                    }
                    appState.compiledCache.set(key, html);
                }
                return { kind: "doc", html };
            }

            if (game.html_payload) return { kind: "doc", html: wrapWithShim(game.html_payload, {}) };

            if (src.kind === "url") {

        async function prepareThumbnail(file) {
            if (!/^image\//.test(file.type)) throw new Error("Thumbnail must be an image file.");
            if (/^image\/(?:svg\+xml|gif)$/.test(file.type)) return await readFileAsDataURL(file, 300000);
            const bmp = await createImageBitmap(file);
            const scale = Math.min(1, 640 / bmp.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(bmp.width * scale));
            canvas.height = Math.max(1, Math.round(bmp.height * scale));
            canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
            if (bmp.close) bmp.close();
            let out = canvas.toDataURL("image/webp", 0.82);
            if (!out.startsWith("data:image/webp")) out = canvas.toDataURL("image/jpeg", 0.85);
            return out;

                : "R GAMES STUDIO is a dark-mode HTML5 gaming destination. Play verified browser games instantly.";
            document.title = title;
            setMetaTag("name", "description", desc);
            setMetaTag("property", "og:title", title);

        function readFileAsDataURL(file, maxBytes = 2500000) {
            return new Promise((resolve, reject) => {
                if (file.size > maxBytes) {
                    reject(new Error(`File "${file.name}" exceeds maximum size (${(maxBytes / 1024 / 1024).toFixed(1)}MB).`));
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.readAsDataURL(file);
            });

        function setRoute(path, query) {
            appState.currentPath = path;
            appState.queryParams = new URLSearchParams(query || "");
        }

        function navigateTo(rawUrl) {
            const [pathPart, queryString] = rawUrl.split("?");
            let normalizedPath = pathPart.trim();
            if (!normalizedPath.startsWith("/")) normalizedPath = "/" + normalizedPath;
            if (normalizedPath === "/") normalizedPath = "/index.html";

            setRoute(normalizedPath, queryString);

            // Shareable links: every page has its own URL (#/game.html?id=...), and Back/Forward work.
            const target = "#" + normalizedPath + (queryString ? "?" + queryString : "");
            try { if (window.location.hash !== target) history.pushState(null, "", target); } catch (err) { /* ignore */ }

            window.scrollTo({ top: 0, behavior: "smooth" });
            renderCurrentRoute();
        }

        function applyRouteFromLocation(render = true) {
            const h = window.location.hash.replace(/^#/, "");
            let path = "/index.html";
            let query = "";
            if (h.startsWith("/")) {
                const parts = h.split("?");
                path = parts[0] === "/" ? "/index.html" : parts[0];
                if (!/\.html$/.test(path)) path += ".html";
                query = parts[1] || "";
            }
            const same = appState.currentPath === path && appState.queryParams.toString() === new URLSearchParams(query).toString();
            setRoute(path, query);
            if (render && !same) renderCurrentRoute();
        }

        window.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.altKey) && e.shiftKey && e.key.toLowerCase() === "a") {
                e.preventDefault();
                if (appState.currentPath.startsWith("/admin/")) {
                    navigateTo("/index.html");
                } else {
                    navigateTo("/admin/login.html");
                }
            }
        });

        window.addEventListener("hashchange", () => applyRouteFromLocation(true));
        window.addEventListener("popstate", () => applyRouteFromLocation(true));

        function renderCurrentRoute() {
            const pubRoot = document.getElementById("publicAppRoot");
            const admRoot = document.getElementById("adminAppRoot");

            if (appState.currentPath.startsWith("/admin/")) {
                pubRoot.style.display = "none";
                pubRoot.innerHTML = "";
                admRoot.style.display = "flex";
                renderAdminSide(admRoot);
            } else {
                admRoot.style.display = "none";
                admRoot.innerHTML = "";
                pubRoot.style.display = "flex";
                renderPublicSide(pubRoot);
            }
        }

        function filterGamesForPublic(publishedGames) {
            let list = [...publishedGames];

            if (appState.selectedCategory && appState.selectedCategory !== "All") {
                list = list.filter(g => g.category === appState.selectedCategory);
            }

            const q = appState.searchQuery.trim().toLowerCase();
            if (q) {
                list = list.filter(g =>
                    (g.title || "").toLowerCase().includes(q) ||
                    (g.description || "").toLowerCase().includes(q) ||
                    (g.category || "").toLowerCase().includes(q) ||
                    (g.tags || "").toLowerCase().includes(q)
                );
            }

            if (appState.publicTab === "new") {
                list.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
            } else if (appState.publicTab === "popular") {
                list.sort((a, b) => (b.plays || 0) - (a.plays || 0) || (b.created_at || 0) - (a.created_at || 0));
            } else if (appState.publicTab === "trending") {
                // Plays weighted by freshness, so new games with real traction rise above old ones.
                const now = Date.now();
                const score = (g) => ((g.plays || 0) + 1) / Math.pow(((now - (g.created_at || now)) / 86400000) + 2, 1.3);
                list.sort((a, b) => score(b) - score(a));
            }

            return list;
        }

        function mountGameIntoPlayer(game) {
            const iframe = document.getElementById("activeGameIframe");
            const loader = document.getElementById("playerLoadingOverlay");
            if (!iframe) return;

            const token = ++appState.playToken;
            appState.playingGameId = game.id;
            const originalLoaderHTML = loader ? loader.innerHTML : "";
            let slowTimer = null;

            const showLoader = () => {
                if (!loader) return;
                loader.innerHTML = originalLoaderHTML;
                loader.style.display = "flex";
                loader.style.opacity = "1";
            };

            const showError = (message, openUrl) => {
                if (!loader || token !== appState.playToken) return;
                loader.style.display = "flex";
                loader.style.opacity = "1";
                loader.innerHTML = `
                    <div style="text-align:center;max-width:440px;padding:20px;">
                        <div style="font-family:var(--font-display);font-size:18px;letter-spacing:1px;margin-bottom:8px;">COULD NOT START GAME</div>
                        <p style="color:var(--text-secondary);font-size:13.5px;margin-bottom:16px;">${escapeHTML(message)}</p>
                        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                            <button type="button" class="btn btn-primary btn-sm" id="btnRetryGame">Try Again</button>
                            ${openUrl ? `<a class="btn btn-secondary btn-sm" href="${escapeHTML(openUrl)}" target="_blank" rel="noopener noreferrer">Open in New Tab</a>` : ""}
                        </div>
                    </div>`;
                const retry = document.getElementById("btnRetryGame");
                if (retry) retry.onclick = () => loadSource();
            };

            const loadSource = async () => {
                clearTimeout(slowTimer);
                showLoader();
                try {
                    const src = await getFrameSource(game);
                    if (token !== appState.playToken || !document.body.contains(iframe)) return;

                    iframe.onload = () => {
                        clearTimeout(slowTimer);
                        if (loader) {
                            loader.style.opacity = "0";
                            setTimeout(() => { loader.style.display = "none"; }, 280);
                        }
                        try { iframe.focus(); } catch (err) { /* ignore */ }
                    };
                    applyFrameSource(iframe, src, loadSavedFor(game.id));
                    recordPlay(game);

                    if (src.kind === "url") {
                        slowTimer = setTimeout(() => {
                            if (loader && loader.style.display !== "none") {
                                showError("This game is taking too long to load. The host may be offline or may block embedding.", src.url);
                            }
                        }, 15000);
                    }
                } catch (err) {
                    console.error("Game load failed:", err);
                    showError(err.message || "Failed to load the game files.", game.source_type === "url" ? game.game_url : "");
                }
            };

            loadSource();

            const reloadBtn = document.getElementById("btnReloadGame");
            if (reloadBtn) {
                reloadBtn.onclick = () => {
                    loadSource();
                    showToast("Game reloaded.", "info");
                };
            }

            const fsBtn = document.getElementById("btnFullscreenGame");
            const viewport = document.getElementById("playerViewportContainer");
            if (fsBtn && viewport) {
                fsBtn.onclick = async () => {
                    if (!document.fullscreenElement) {
                        try {
                            if (viewport.requestFullscreen) await viewport.requestFullscreen();
                            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
                        } catch (err) { /* fullscreen can be refused by the browser */ }
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                    }
                };
                document.onfullscreenchange = () => {
                    const label = document.getElementById("fullscreenBtnLabel");
                    if (label) {

        function bindPublicEvents() {
            const signInBtn = document.getElementById("btnSignIn");
            if (signInBtn) signInBtn.onclick = () => openAuthModal("login");

            const signOutBtn = document.getElementById("btnSignOut");
            if (signOutBtn) {
                signOutBtn.onclick = async () => {
                    await signOutEverywhere();
                    showToast("You have been signed out.", "info");
                    renderCurrentRoute();
                };
            }

            document.querySelectorAll("[data-public-link]").forEach(el => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    navigateTo(el.getAttribute("data-public-link"));
                });
            });

            const exploreBtn = document.getElementById("heroExploreBtn");
            if (exploreBtn) {
                exploreBtn.addEventListener("click", () => {
                    const sec = document.getElementById("arenaLibrarySection");
                    if (sec) sec.scrollIntoView({ behavior: "smooth" });
                });
            }

            const mobileToggle = document.getElementById("mobileNavToggle");
            const navMenu = document.getElementById("publicNavMenu");
            if (mobileToggle && navMenu) {
                mobileToggle.addEventListener("click", () => {
                    navMenu.classList.toggle("mobile-open");
                });
            }

            const searchInput = document.getElementById("publicSearchInput");
            if (searchInput) {
                searchInput.addEventListener("input", (e) => {
                    appState.searchQuery = e.target.value;
                    const gridMount = document.getElementById("publicGamesGridMount");
                    const countPill = document.getElementById("liveVisibleCountPill");
                    if (gridMount) {
                        const publishedGames = getPublishedGames();
                        const filteredGames = filterGamesForPublic(publishedGames);
                        if (countPill) countPill.textContent = `${filteredGames.length} / ${publishedGames.length} Games`;
                        if (publishedGames.length === 0) {
                            gridMount.innerHTML = renderEmptyArenaState("THE ARENA IS WAITING.", "No games have been published yet. Check back soon for the first drop.");
                        } else if (filteredGames.length === 0) {
                            gridMount.innerHTML = renderEmptyArenaState("NO MATCHING GAMES FOUND", `No published games matched "${appState.searchQuery}".`);
                        } else {
                            gridMount.innerHTML = `<div class="games-grid">${filteredGames.map(renderGameCardHTML).join("")}</div>`;
                            bindGameCardClicks();
                        }
                    }
                });
            }

            document.querySelectorAll("[data-lib-tab]").forEach(btn => {
                btn.addEventListener("click", () => {
                    appState.publicTab = btn.getAttribute("data-lib-tab");
                    renderPublicSide(document.getElementById("publicAppRoot"));
                });
            });

            document.querySelectorAll("[data-cat-pill]").forEach(btn => {
                btn.addEventListener("click", () => {
                    appState.selectedCategory = btn.getAttribute("data-cat-pill");
                    renderPublicSide(document.getElementById("publicAppRoot"));
                });
            });

            bindGameCardClicks();
        }

        function bindGameCardClicks() {
            document.querySelectorAll("[data-play-game]").forEach(card => {
                const open = () => {
                    const id = card.getAttribute("data-play-game");
                    navigateTo(`/game.html?id=${encodeURIComponent(id)}`);
                };
                card.onclick = open;
                card.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        open();
                    }
                };
            });
        }

            return true;
        }

            if (!isSessionValid() && appState.currentPath !== "/admin/login.html") {

                                    </div>
