                            <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px;">
                                <button type="button" class="btn btn-secondary" id="btnTestBeforePublish">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                    Test & Preview Game Source
                                </button>
                                <button type="submit" class="btn btn-primary" id="btnSubmitGame">
                                    ${editingGame ? "Save Updated Game" : "Validate & Save Game"}
                                </button>
                            </div>
                        </form>
                    </div>
                `;
            }

            if (v === "categories") {
                return `
                    <div class="form-card">
                        <h3 style="font-family:var(--font-display);font-size:20px;margin-bottom:12px;text-transform:uppercase;">Category Breakdown</h3>
                        <p style="color:var(--text-secondary);font-size:13.5px;margin-bottom:24px;">
                            Note: Only categories with at least 1 published game are displayed on the Public Website.
                        </p>
                        <div class="table-wrap">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Category Name</th>
                                        <th>Slug</th>
                                        <th>Total Games</th>
                                        <th>Published Games</th>
                                        <th>Public Visibility</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${ALLOWED_CATEGORIES.map(cat => {
                                        const totalInCat = appState.games.filter(g => g.category === cat).length;
                                        const pubInCat = appState.games.filter(g => g.category === cat && g.status === "published").length;
                                        return `
                                            <tr>
                                                <td style="font-weight:700;">${escapeHTML(cat)}</td>
                                                <td style="font-family:var(--font-mono);color:var(--text-secondary);">/${escapeHTML(slugify(cat))}</td>
                                                <td>${totalInCat}</td>
                                                <td>${pubInCat}</td>
                                                <td>
                                                    ${pubInCat > 0
                                                        ? `<span class="status-badge status-published">Visible on Public Site</span>`
                                                        : `<span class="status-badge status-draft">Hidden (0 Published)</span>`
                                                    }
                                                </td>
                                            </tr>
                                        `;
                                    }).join("")}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (v === "settings") {
                return `
                    <div class="form-card">
                        <h3 style="font-family:var(--font-display);font-size:20px;margin-bottom:10px;text-transform:uppercase;">
                            Export Complete Multi-File Project ZIP
                        </h3>
                        <p style="color:var(--text-secondary);font-size:13.5px;margin-bottom:20px;">
                            Download the clean, standalone multi-file repository (<code>r-games-studio.zip</code>) containing all separate HTML, CSS, and Vanilla JS files (<code>index.html</code>, <code>admin/login.html</code>, <code>css/style.css</code>, <code>js/database.js</code>, etc.) ready for Vercel, Netlify, or Supabase/Firebase production hosting.
                        </p>
                        <button type="button" class="btn btn-primary" id="btnExportProjectZip">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Download Full Multi-File Project (.ZIP)
                        </button>
                    </div>

                    <div class="form-card" style="margin-top:20px;">
                        <h3 style="font-family:var(--font-display);font-size:20px;margin-bottom:10px;text-transform:uppercase;">Change Owner Password</h3>
                        <p style="color:var(--text-secondary);font-size:13.5px;margin-bottom:16px;">Use at least 10 characters. You will stay signed in on this device.</p>
                        <form id="changePassForm" style="display:grid;gap:12px;max-width:420px;">
                            <input type="password" id="cpCurrent" class="form-input" placeholder="Current password" autocomplete="current-password" required>
                            <input type="password" id="cpNew" class="form-input" placeholder="New password (min 10 characters)" autocomplete="new-password" minlength="10" required>
                            <input type="password" id="cpConfirm" class="form-input" placeholder="Confirm new password" autocomplete="new-password" minlength="10" required>
                            <button type="submit" class="btn btn-primary" id="cpSubmit">Update Password</button>
                        </form>
                    </div>
                `;
            }

            let topPanel = "";
            if (v === "dashboard" && appState.games.length) {
                const top = [...appState.games].sort((a, b) => (b.plays || 0) - (a.plays || 0)).slice(0, 5);
                const maxPlays = Math.max(1, top[0].plays || 0);
                topPanel = `
                    <div class="form-card" style="margin-bottom:20px;">
                        <h3 style="font-family:var(--font-display);font-size:18px;text-transform:uppercase;margin-bottom:14px;">Top Games by Plays</h3>
                        ${top.map(g => `
                            <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                                <div style="width:170px;flex-shrink:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(g.title)}</div>
                                <div style="flex:1;height:8px;background:var(--bg-elevated);border-radius:99px;overflow:hidden;">
                                    <div style="width:${Math.round(((g.plays || 0) / maxPlays) * 100)}%;height:100%;background:var(--fire-primary);"></div>
                                </div>
                                <div style="width:64px;text-align:right;font-family:var(--font-mono);font-size:12.5px;">${Number(g.plays || 0).toLocaleString()}</div>
                            </div>
                        `).join("")}
                    </div>`;
            }

            let list = [...appState.games];
            if (v === "published") list = list.filter(g => g.status === "published");
            if (v === "drafts") list = list.filter(g => g.status === "draft");

            return topPanel + `
                <div class="table-wrap">
                    <div style="padding:18px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                        <h3 style="font-family:var(--font-display);font-size:18px;text-transform:uppercase;">
                            Managed Games (${list.length})
                        </h3>
                        <div style="display:flex;gap:10px;">
                            <input type="text" id="adminTableSearch" class="form-input" style="padding:7px 12px;font-size:13px;" placeholder="Filter by title or category...">
                        </div>
                    </div>

                    ${list.length === 0 ? `
                        <div style="padding:56px 24px;text-align:center;color:var(--text-secondary);">
                            No games in this view yet. Click <strong>"Upload Game"</strong> to upload your first HTML5 game.
                        </div>
                    ` : `
                        <table class="admin-table" id="adminGamesTable">
                            <thead>
                                <tr>
                                    <th>Game</th>
                                    <th>Category</th>
                                    <th>Source Type</th>
                                    <th>Status</th>
                                    <th>Plays</th>
                                    <th>Uploaded</th>
                                    <th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${list.map(game => `
                                    <tr data-game-row="${escapeHTML((game.title + ' ' + game.category).toLowerCase())}">
                                        <td>
                                            <div style="display:flex;align-items:center;gap:12px;">
                                                <img src="${escapeHTML(game.thumbnail_url)}" alt="" style="width:52px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border-color);">
                                                <div>
                                                    <div style="font-weight:700;color:var(--text-primary);">${escapeHTML(game.title)}</div>
                                                    <div style="font-size:11.5px;color:var(--text-muted);">${escapeHTML(game.assets_count || 1)} verified asset(s)</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>${escapeHTML(game.category)}</td>
                                        <td style="font-family:var(--font-mono);font-size:12px;text-transform:uppercase;">${escapeHTML(game.source_type || "html")}</td>
                                        <td>
                                            <span class="status-badge ${game.status === 'published' ? 'status-published' : 'status-draft'}">
                                                ${escapeHTML(game.status)}
                                            </span>
                                        </td>
                                        <td style="font-family:var(--font-mono);font-size:12.5px;">${Number(game.plays || 0).toLocaleString()}</td>
                                        <td>${escapeHTML(formatDate(game.created_at))}</td>
                                        <td style="text-align:right;">
                                            <div style="display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
                                                <button type="button" class="btn btn-secondary btn-sm" data-adm-preview="${escapeHTML(game.id)}">Preview</button>
                                                <button type="button" class="btn btn-secondary btn-sm" data-adm-toggle="${escapeHTML(game.id)}">
                                                    ${game.status === 'published' ? 'Unpublish' : 'Publish'}
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-sm" data-adm-edit="${escapeHTML(game.id)}">Edit</button>
                                                <button type="button" class="btn btn-danger btn-sm" data-adm-delete="${escapeHTML(game.id)}">Delete</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    `}
                </div>
            `;
        }

        function bindAdminEvents() {
            document.querySelectorAll(".admin-nav-item").forEach(item => {
                item.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        item.click();
                    }
                });
            });

            document.querySelectorAll("[data-adm-nav]").forEach(item => {
                item.onclick = () => {
                    appState.editingGameId = null;
                    appState.adminSubView = item.getAttribute("data-adm-nav");
                    renderAdminSide(document.getElementById("adminAppRoot"));
                };
            });

            const logoutBtn = document.getElementById("adminLogoutBtn");
            if (logoutBtn) {
                logoutBtn.onclick = async () => {
                    await signOutEverywhere();
                    showToast("Logged out of Admin Portal.", "info");
                    navigateTo("/admin/login.html");
                };
            }

            const pubBtn = document.getElementById("admViewPublicSiteBtn");
            if (pubBtn) pubBtn.onclick = () => navigateTo("/index.html");

            const quickUpBtn = document.getElementById("admQuickUploadBtn");
            if (quickUpBtn) {
                quickUpBtn.onclick = () => {
                    appState.editingGameId = null;
                    appState.adminSubView = "upload";
                    renderAdminSide(document.getElementById("adminAppRoot"));
                };
            }

            const cancelEditBtn = document.getElementById("cancelEditBtn");
            if (cancelEditBtn) {
                cancelEditBtn.onclick = () => {
                    appState.editingGameId = null;
                    appState.adminSubView = "all-games";
                    renderAdminSide(document.getElementById("adminAppRoot"));
                };
            }

            const modeInput = document.getElementById("upSourceMode");
            const sourceTabs = document.querySelectorAll("[data-source-mode]");
            const syncSourceBoxes = (mode) => {
                if (!modeInput) return;
                modeInput.value = mode;
                sourceTabs.forEach(t => t.classList.toggle("active", t.getAttribute("data-source-mode") === mode));
                document.getElementById("sourceBoxZip").style.display = mode === "zip" ? "block" : "none";
                document.getElementById("sourceBoxUrl").style.display = mode === "url" ? "block" : "none";
                document.getElementById("sourceBoxHtml").style.display = mode === "html" ? "block" : "none";
            };
            sourceTabs.forEach(tab => {
                tab.onclick = () => syncSourceBoxes(tab.getAttribute("data-source-mode"));
            });
            if (modeInput) syncSourceBoxes(modeInput.value || "zip");

            const zipFileInp = document.getElementById("upZipFile");
            if (zipFileInp) {
                zipFileInp.onchange = () => {
                    const f = zipFileInp.files[0];
                    if (f) {
                        document.getElementById("zipStatusText").innerHTML = `<strong style="color:var(--success);">Selected Archive:</strong> ${escapeHTML(f.name)} (${(f.size / 1024).toFixed(1)} KB)`;
                    }
                };
            }

            const htmlFileInp = document.getElementById("upHtmlFile");
            if (htmlFileInp) {
                htmlFileInp.onchange = () => {
                    const f = htmlFileInp.files[0];
                    if (f) {
                        document.getElementById("htmlStatusText").innerHTML = `<strong style="color:var(--success);">Selected HTML5 File:</strong> ${escapeHTML(f.name)} (${(f.size / 1024).toFixed(1)} KB)`;
                    }
                };
            }

            function keepExistingSource(game) {
                return {
                    keep: true,
                    source_type: game.source_type,
                    assets_count: game.assets_count || 1,
                    getSource: () => getFrameSource(game)
                };
            }

            async function resolveSubmittedGameSource(existingGame) {
                const mode = document.getElementById("upSourceMode").value;
                const canKeep = !!(existingGame && existingGame.source_type !== "url" && (existingGame.package_id || existingGame.html_payload));

                if (mode === "zip" || mode === "html") {
                    const file = document.getElementById(mode === "zip" ? "upZipFile" : "upHtmlFile").files[0];
                    if (!file) {
                        if (canKeep) return keepExistingSource(existingGame);
                        throw new Error(mode === "zip" ? "Please select a .zip HTML5 game archive." : "Please select an HTML5 .html file.");
                    }

                    let bytes;
                    if (mode === "zip") {
                        if (!file.name.toLowerCase().endsWith(".zip")) {
                            throw new Error("Invalid archive format. Please select a valid .zip HTML5 game archive.");
                        }
                        if (file.size > MAX_PACKAGE_MB * 1024 * 1024) {
                            throw new Error(`Archive exceeds the ${MAX_PACKAGE_MB}MB limit.`);
                        }
                        bytes = new Uint8Array(await file.arrayBuffer());
                    } else {
                        const htmlText = await readFileAsText(file);
                        const lower = htmlText.toLowerCase();
                        if (!lower.includes("<html") && !lower.includes("<canvas") && !lower.includes("<script")) {
                            throw new Error("Uploaded file does not appear to be a valid playable HTML5 document.");
                        }
                        bytes = await buildZipFromHtml(htmlText);
                    }

                    const info = await loadAndValidateZip(bytes);
                    return {
                        source_type: "package",
                        bytes,
                        assets_count: info.count,
                        getSource: async () => ({ kind: "doc", html: (await compileZipToSrcdoc(info.zip)).html })
                    };
                }

                const rawUrl = document.getElementById("upHostedUrl").value.trim();
                if (!rawUrl.startsWith("https://")) {
                    throw new Error("Hosted game URL must use secure HTTPS protocol.");
                }
                return {
                    source_type: "url",
                    game_url: rawUrl,
                    assets_count: 1,
                    getSource: async () => ({ kind: "url", url: rawUrl })
                };
            }

            const testBtn = document.getElementById("btnTestBeforePublish");
            if (testBtn) {
                testBtn.onclick = async () => {
                    try {
                        const existingGame = appState.editingGameId ? appState.games.find(g => g.id === appState.editingGameId) : null;
                        const resolved = await resolveSubmittedGameSource(existingGame);
                        openModal(`
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                                <h3 style="font-family:var(--font-display);text-transform:uppercase;">Pre-Publication Sandbox Test</h3>
                                <button type="button" class="btn btn-secondary btn-sm" id="closeModalBtn">Close Test</button>
                            </div>
                            <div style="aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--border-color);">
                                <iframe id="sandboxTestFrame" style="width:100%;height:100%;border:none;" sandbox="allow-scripts"></iframe>
                            </div>
                            <p style="font-size:12.5px;color:var(--success);margin-top:12px;">
                                Verified: Source validated (${resolved.assets_count} file(s) verified). Ready for publication.
                            </p>
                        `);
                        document.getElementById("closeModalBtn").onclick = closeModal;
                        const frame = document.getElementById("sandboxTestFrame");
                        applyFrameSource(frame, await resolved.getSource(), {});
                    } catch (err) {
                        showToast(err.message, "error");
                    }
                };
            }

            const uploadForm = document.getElementById("gameUploadForm");
            if (uploadForm) {
                uploadForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const submitBtn = document.getElementById("btnSubmitGame");
                    submitBtn.disabled = true;
                    submitBtn.textContent = "Validating & Uploading...";

                    let newPackageId = null;
                    let uploadGameId = null;
                    let keepPkgOnFail = null;
                    let recordSaved = false;
                    try {
                        const existingGame = appState.editingGameId ? appState.games.find(g => g.id === appState.editingGameId) : null;
                        const title = document.getElementById("upTitle").value.trim();
                        const category = document.getElementById("upCategory").value;
                        const description = document.getElementById("upDescription").value.trim();
                        const instructions = document.getElementById("upInstructions").value.trim();
                        const tags = document.getElementById("upTags").value.trim();
                        const status = document.getElementById("upStatus").value;

                        let thumbnailUrl = document.getElementById("upThumbUrl").value.trim();
                        const thumbFile = document.getElementById("upThumbFile").files[0];
                        if (thumbFile) {
                            thumbnailUrl = await prepareThumbnail(thumbFile);
                        } else if (thumbnailUrl && !/^https:\/\//i.test(thumbnailUrl)) {
                            throw new Error("Thumbnail URL must start with https://");
                        } else if (!thumbnailUrl && existingGame?.thumbnail_url) {
                            thumbnailUrl = existingGame.thumbnail_url;
                        }
                        if (!thumbnailUrl) {
                            throw new Error("Please upload a game thumbnail image or provide a valid HTTPS thumbnail URL.");
                        }

                        const sourceData = await resolveSubmittedGameSource(existingGame);
                        const gameId = existingGame ? existingGame.id : "game_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
                        uploadGameId = gameId;
                        keepPkgOnFail = existingGame ? (existingGame.package_id || null) : null;

                        let sourceFields;
                        if (sourceData.bytes) {
                            newPackageId = "p" + Date.now().toString(36);
                            submitBtn.textContent = "Uploading game files...";
                            const chunkCount = await savePackageChunks(gameId, newPackageId, sourceData.bytes, (done, total) => {
                                submitBtn.textContent = `Uploading game files... ${done}/${total}`;
                            });
                            sourceFields = {
                                source_type: "package",
                                package_id: newPackageId,
                                chunk_count: chunkCount,
                                package_bytes: sourceData.bytes.length,
                                game_url: "",
                                html_payload: "",
                                assets_count: sourceData.assets_count
                            };
                        } else if (sourceData.keep) {
                            sourceFields = {
                                source_type: existingGame.source_type,
                                package_id: existingGame.package_id || "",
                                chunk_count: existingGame.chunk_count || 0,
                                package_bytes: existingGame.package_bytes || 0,
                                game_url: existingGame.game_url || "",
                                html_payload: existingGame.html_payload || "",
                                assets_count: sourceData.assets_count
                            };
                        } else {
                            sourceFields = {
                                source_type: "url",
                                package_id: "",
                                chunk_count: 0,
                                package_bytes: 0,
                                game_url: sourceData.game_url,
                                html_payload: "",
                                assets_count: 1
                            };
                        }

                        const gameRecord = {
                            id: gameId,
                            title,
                            description,
                            thumbnail_url: thumbnailUrl,
                            category,
                            tags,
                            instructions,
                            status,
                            ...sourceFields,
                            is_validated: true,
                            created_at: existingGame ? existingGame.created_at : Date.now(),
                            updated_at: Date.now()
                        };
                        if (!existingGame) gameRecord.plays = 0;
                        if (JSON.stringify(gameRecord).length > 950000) {
                            throw new Error("Game record is too large for the database. Use a smaller thumbnail.");
                        }

                        await saveGameToDatabase(gameRecord);
                        recordSaved = true;
                        // Remove superseded package chunks only after the new record is safely stored.
                        try { await deletePackageChunks(gameId, sourceFields.package_id || null); } catch (err) { console.warn("Old file cleanup skipped:", err); }
                        appState.editingGameId = null;
                        appState.adminSubView = "all-games";
                        showToast(`"${title}" successfully validated and saved as ${status.toUpperCase()}!`, "success");
                        renderAdminSide(document.getElementById("adminAppRoot"));
                    } catch (err) {
                        showToast(err.message || "Upload failed.", "error");
                        if (newPackageId && uploadGameId && !recordSaved) {
                            // Upload failed after chunks were written: remove the orphaned chunks, keep the previous package.
                            try { await deletePackageChunks(uploadGameId, keepPkgOnFail); } catch (cleanupErr) { /* ignore */ }
                        }
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Validate & Save Game";
                    }
                };
            }

            const cpForm = document.getElementById("changePassForm");
            if (cpForm) {
                cpForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const cur = document.getElementById("cpCurrent").value;
                    const next = document.getElementById("cpNew").value;
                    const confirmNext = document.getElementById("cpConfirm").value;
                    const btn = document.getElementById("cpSubmit");
                    if (next.length < 10) { showToast("New password must be at least 10 characters.", "error"); return; }
                    if (next !== confirmNext) { showToast("New passwords do not match.", "error"); return; }
                    btn.disabled = true;
                    try {
                        await apiCall("/api/change-password", "POST", { currentPassword: cur, newPassword: next });
                        cpForm.reset();
                        showToast("Password updated.", "success");
                    } catch (err) {
                        showToast(err.message || "Could not update the password.", "error");
                    } finally {
                        btn.disabled = false;
                    }
                };
            }

            const tblSearch = document.getElementById("adminTableSearch");
            if (tblSearch) {
                tblSearch.oninput = (e) => {
                    const q = e.target.value.toLowerCase().trim();
                    document.querySelectorAll("[data-game-row]").forEach(row => {
                        const hay = row.getAttribute("data-game-row");
                        row.style.display = hay.includes(q) ? "" : "none";
                    });
                };
            }

            document.querySelectorAll("[data-adm-preview]").forEach(btn => {
                btn.onclick = async () => {
                    const game = appState.games.find(g => g.id === btn.getAttribute("data-adm-preview"));
                    if (!game) return;
                    openModal(`
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                            <h3 style="font-family:var(--font-display);text-transform:uppercase;">Admin Preview: ${escapeHTML(game.title)}</h3>
                            <button type="button" class="btn btn-secondary btn-sm" id="closePreviewModal">Close</button>
                        </div>
                        <div style="aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--border-color);">
                            <iframe id="admPreviewFrame" style="width:100%;height:100%;border:none;" sandbox="allow-scripts" allow="fullscreen; autoplay; gamepad"></iframe>
                        </div>
                    `);
                    document.getElementById("closePreviewModal").onclick = closeModal;
                    const frame = document.getElementById("admPreviewFrame");
                    try {
                        applyFrameSource(frame, await getFrameSource(game), {});
                    } catch (err) {
                        showToast(err.message || "Could not load preview.", "error");
                    }
                };
            });

            document.querySelectorAll("[data-adm-toggle]").forEach(btn => {
                btn.onclick = async () => {
                    const game = appState.games.find(g => g.id === btn.getAttribute("data-adm-toggle"));
                    if (!game) return;
                    const nextStatus = game.status === "published" ? "draft" : "published";
                    await saveGameToDatabase({ ...game, status: nextStatus, updated_at: Date.now() });
                    showToast(`"${game.title}" is now ${nextStatus.toUpperCase()}.`, "success");
                };
            });

            document.querySelectorAll("[data-adm-edit]").forEach(btn => {
                btn.onclick = () => {
                    appState.editingGameId = btn.getAttribute("data-adm-edit");
                    appState.adminSubView = "upload";
                    renderAdminSide(document.getElementById("adminAppRoot"));
                };
            });

            document.querySelectorAll("[data-adm-delete]").forEach(btn => {
                btn.onclick = () => {
                    const game = appState.games.find(g => g.id === btn.getAttribute("data-adm-delete"));
                    if (!game) return;
                    openModal(`
                        <h3 style="font-family:var(--font-display);font-size:22px;margin-bottom:12px;text-transform:uppercase;">Confirm Permanent Deletion</h3>
                        <p style="color:var(--text-secondary);font-size:14px;margin-bottom:24px;">
                            Are you sure you want to delete <strong>${escapeHTML(game.title)}</strong> and remove all associated game assets from storage? This action cannot be undone.
                        </p>
                        <div style="display:flex;justify-content:flex-end;gap:12px;">
                            <button type="button" class="btn btn-secondary" id="cancelDelBtn">Cancel</button>
                            <button type="button" class="btn btn-danger" id="confirmDelBtn">Delete Permanently</button>
                        </div>
                    `);
                    document.getElementById("cancelDelBtn").onclick = closeModal;
                    document.getElementById("confirmDelBtn").onclick = async () => {
                        await deleteGameFromDatabase(game.id);
                        closeModal();
                        showToast(`Deleted "${game.title}" and cleaned up stored assets.`, "info");
                    };
                };
            });

            const exportBtn = document.getElementById("btnExportProjectZip");
            if (exportBtn) {
                exportBtn.onclick = async () => {
                    exportBtn.disabled = true;
                    exportBtn.textContent = "Packaging r-games-studio.zip...";
                    try {
                        const zip = new window.JSZip();
                        const rootFolder = zip.folder("r-games-studio");

                        const cssContent = document.querySelector("style").innerHTML;
                        rootFolder.file("css/style.css", cssContent);
                        rootFolder.file("css/responsive.css", "/* Responsive rules included in style.css */");
                        rootFolder.file("css/admin.css", "/* Admin dark crimson styles included in style.css */");
                        rootFolder.file("css/player.css", "/* Sandboxed HTML5 player styles included in style.css */");

                        const fullHtml = document.documentElement.outerHTML;
                        rootFolder.file("index.html", fullHtml);
                        rootFolder.file("games.html", fullHtml);
                        rootFolder.file("game.html", fullHtml);
                        rootFolder.file("about.html", fullHtml);
                        rootFolder.file("admin/login.html", fullHtml);
                        rootFolder.file("admin/dashboard.html", fullHtml);
                        rootFolder.file("admin/upload.html", fullHtml);
                        rootFolder.file("admin/manage-games.html", fullHtml);
                        rootFolder.file("admin/categories.html", fullHtml);
                        rootFolder.file("admin/settings.html", fullHtml);
                        rootFolder.file(".gitignore", "node_modules/\n.env\n.DS_Store\n");
                        rootFolder.file("README.md", "# R GAMES STUDIO\n\nProduction HTML5 Gaming Portal built with HTML5, CSS3, and Vanilla ES6+ JavaScript.\n");

                        const blob = await zip.generateAsync({ type: "blob" });
                        const dlUrl = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = dlUrl;
                        a.download = "r-games-studio.zip";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        URL.revokeObjectURL(dlUrl);
                        showToast("Downloaded r-games-studio.zip!", "success");
                    } catch (err) {
                        showToast("Failed to generate ZIP: " + err.message, "error");
                    } finally {
                        exportBtn.disabled = false;
                        exportBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Full Multi-File Project (.ZIP)`;
                    }
                };
            }
        }

        /* --------------------------------------------------------------------------
           MODULE 7: ULTRA-LIGHTWEIGHT 60FPS FIRE & ELECTRIC-BLUE ENERGY CANVAS
           -------------------------------------------------------------------------- */
        function initFuturisticEnergyCanvas() {
            const canvas = document.getElementById("energyFxCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d", { alpha: true });
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const PARTICLE_COUNT = window.innerWidth < 768 ? 16 : 28;
            const particles = [];

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }, { passive: true });

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const isElectric = i % 2 === 0;
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: isElectric ? -(Math.random() * 0.5 + 0.15) : -(Math.random() * 0.7 + 0.2),
                    size: Math.random() * 2.2 + 1.2,
                    color: isElectric ? "rgba(0, 240, 255, 0.55)" : "rgba(255, 42, 95, 0.55)",
                    halo: isElectric ? "rgba(0, 240, 255, 0.12)" : "rgba(255, 107, 0, 0.12)"
                });
            }

            function animateEnergy() {
                if (document.hidden || appState.currentPath === "/game.html") {
                    ctx.clearRect(0, 0, width, height);
                    setTimeout(animateEnergy, 500);
                    return;
                }
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = width;
                    else if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    else if (p.y > height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 3.2, 0, Math.PI * 2);
                    ctx.fillStyle = p.halo;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }

                requestAnimationFrame(animateEnergy);
            }

            animateEnergy();
        }

        // Game saves (localStorage of sandboxed games) are relayed through the player and kept per game.
        window.addEventListener("message", (e) => {
            const iframe = document.getElementById("activeGameIframe");
            if (!iframe || e.source !== iframe.contentWindow || !appState.playingGameId) return;
            const d = e.data;
            if (!d || d.__rg !== 1 || d.t !== "save" || typeof d.d !== "object" || d.d === null) return;
            try {
                const s = JSON.stringify(d.d);
                if (s.length <= 262144) localStorage.setItem("rg_save_" + appState.playingGameId, s);
            } catch (err) { /* quota or privacy mode */ }
        });

        /* --------------------------------------------------------------------------
           THUNDER & TOUCH SPARKS: random lightning in the sky + sparks/arcs wherever you touch
           -------------------------------------------------------------------------- */
        (function initThunderFx() {
            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            const cv = document.createElement("canvas");
            cv.id = "thunderFxCanvas";
            document.body.appendChild(cv);
            const ctx = cv.getContext("2d");
            let W = 0, H = 0, dpr = 1, raf = 0, flash = 0, lastMove = 0;
            const bolts = [], sparks = [], rings = [];
            const COLORS = ["#00E5FF", "#FF607F", "#FFFFFF", "#F04468", "#9EF3FF"];
            const rnd = (a, b) => a + Math.random() * (b - a);

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth; H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener("resize", resize);

            // Jagged path between two points (midpoint displacement)
            function path(x1, y1, x2, y2, disp) {
                let pts = [[x1, y1], [x2, y2]];
                while (disp > 2.5) {
                    const next = [pts[0]];
                    for (let i = 1; i < pts.length; i++) {
                        const a = pts[i - 1], b = pts[i];
                        const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
                        const off = rnd(-disp, disp);
                        next.push([(a[0] + b[0]) / 2 - dy / len * off, (a[1] + b[1]) / 2 + dx / len * off], b);
                    }
                    pts = next; disp /= 2;
                }
                return pts;
            }

            function addBolt(x1, y1, x2, y2, opt = {}) {
                const len = Math.hypot(x2 - x1, y2 - y1);
                const main = path(x1, y1, x2, y2, len * 0.22);
                const branches = [];
                const n = opt.branches ?? Math.floor(len / 160);
                for (let i = 0; i < n; i++) {
                    const p = main[Math.floor(rnd(2, main.length - 2))];
                    if (!p) continue;
                    const ang = Math.atan2(y2 - y1, x2 - x1) + rnd(-0.9, 0.9);
                    const bl = rnd(len * 0.1, len * 0.3);
                    branches.push(path(p[0], p[1], p[0] + Math.cos(ang) * bl, p[1] + Math.sin(ang) * bl, bl * 0.25));
                }
                bolts.push({ main, branches, life: 1, decay: opt.decay || 0.045, w: opt.w || 2.4, color: opt.color || "#00E5FF" });
                start();
            }

            function burst(x, y, count, power) {
                for (let i = 0; i < count && sparks.length < 220; i++) {
                    const a = rnd(0, Math.PI * 2), s = rnd(1.5, power);
                    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.8, life: 1, decay: rnd(0.025, 0.06), c: COLORS[(Math.random() * COLORS.length) | 0], len: rnd(4, 11) });
                }
                start();
            }

            function touchZap(x, y) {
                burst(x, y, 22, 8);
                rings.push({ x, y, r: 4, life: 1 });
                for (let i = 0; i < 3; i++) {
                    const a = rnd(0, Math.PI * 2), l = rnd(45, 110);
                    addBolt(x, y, x + Math.cos(a) * l, y + Math.sin(a) * l, { branches: 1, decay: 0.09, w: 1.8, color: Math.random() < 0.5 ? "#00E5FF" : "#FF607F" });
                }
                if (navigator.vibrate && Math.random() < 0.5) { try { navigator.vibrate(8); } catch (e) { /* ignore */ } }
            }

            function skyStrike() {
                if (!document.hidden) {
                    const x = rnd(W * 0.08, W * 0.92);
                    addBolt(x, -10, x + rnd(-120, 120), rnd(H * 0.35, H * 0.8), { w: 3.2, decay: 0.03, branches: 4, color: "#9EF3FF" });
                    flash = 0.14;
                    if (Math.random() < 0.45) setTimeout(() => addBolt(x + rnd(-60, 60), -10, x + rnd(-160, 160), rnd(H * 0.3, H * 0.6), { w: 2.4, decay: 0.05, color: "#FF9EB1" }), 120);
                }
                setTimeout(skyStrike, rnd(3500, 8000));
            }

            function frame() {
                ctx.clearRect(0, 0, W, H);
                ctx.globalCompositeOperation = "lighter";
                if (flash > 0.005) { ctx.fillStyle = `rgba(120,220,255,${flash})`; ctx.fillRect(0, 0, W, H); flash *= 0.86; }

                for (let i = bolts.length - 1; i >= 0; i--) {
                    const b = bolts[i];
                    b.life -= b.decay;
                    if (b.life <= 0) { bolts.splice(i, 1); continue; }
                    const a = b.life * (Math.random() < 0.25 ? 0.35 : 1);
                    const draw = (pts, w) => {
                        ctx.beginPath();
                        pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
                        ctx.lineWidth = w; ctx.stroke();
                    };
                    ctx.lineJoin = "round"; ctx.lineCap = "round";
                    ctx.shadowBlur = 22; ctx.shadowColor = b.color;
                    ctx.strokeStyle = b.color; ctx.globalAlpha = a * 0.55;
                    draw(b.main, b.w * 3); b.branches.forEach(p => draw(p, b.w * 1.6));
                    ctx.shadowBlur = 0; ctx.strokeStyle = "#FFFFFF"; ctx.globalAlpha = a;
                    draw(b.main, b.w); b.branches.forEach(p => draw(p, b.w * 0.6));
                }

                ctx.shadowBlur = 0;
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const s = sparks[i];
                    s.life -= s.decay;
                    if (s.life <= 0) { sparks.splice(i, 1); continue; }
                    s.vy += 0.18; s.vx *= 0.97; s.x += s.vx; s.y += s.vy;
                    ctx.globalAlpha = s.life; ctx.strokeStyle = s.c; ctx.lineWidth = 2;
                    const k = s.len / (Math.hypot(s.vx, s.vy) || 1);
                    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * k, s.y - s.vy * k); ctx.stroke();
                }

                for (let i = rings.length - 1; i >= 0; i--) {
                    const r = rings[i];
                    r.life -= 0.06; r.r += 3.2;
                    if (r.life <= 0) { rings.splice(i, 1); continue; }
                    ctx.globalAlpha = r.life * 0.8; ctx.strokeStyle = "#00E5FF"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
                }

                ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
                if (bolts.length || sparks.length || rings.length || flash > 0.005) raf = requestAnimationFrame(frame);
                else { raf = 0; ctx.clearRect(0, 0, W, H); }
            }
            function start() { if (!raf) raf = requestAnimationFrame(frame); }

            window.addEventListener("pointerdown", (e) => touchZap(e.clientX, e.clientY), { passive: true });
            window.addEventListener("pointermove", (e) => {
                const now = performance.now();
                if (now - lastMove < 45) return;
                if (e.pointerType === "mouse" && !(e.target.closest && e.target.closest("button, a, .game-card, .rg-perk, .spotlight-feature-card"))) return;
                lastMove = now;
                burst(e.clientX, e.clientY, 2, 3.5);
            }, { passive: true });

            setTimeout(skyStrike, 1500);
        })();

        document.addEventListener("pointermove", (e) => {
            const t = e.target.closest && e.target.closest(".rg-perk");
            if (!t) return;
            const r = t.getBoundingClientRect();
            t.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
            t.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
        }, { passive: true });

        window.addEventListener("DOMContentLoaded", async () => {
            applyRouteFromLocation(false);
            initFuturisticEnergyCanvas();
            await restoreSession();   // Neon session (cookie) -> signed-in user / admin
            initCloudDatabase();
        });
    </script>
